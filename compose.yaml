services:
  airport:
    image: ghcr.io/chainfix/airport:latest
    build: .
    restart: unless-stopped
    ports:
      # Set this to the NAS LAN IPv4. Never forward the panel port on the router.
      - "${AIRPORT_PANEL_BIND:-127.0.0.1}:8787:8787/tcp"
      - "17595:17595/tcp"
      - "17596:17596/tcp"
    volumes:
      - airport-data:/data
      # Optional: NAS directory containing fullchain.pem and privkey.pem.
      # - /your/nas/certificate-directory:/certs:ro
    environment:
      TZ: Asia/Shanghai
      AIRPORT_TLS_HOST: 0.0.0.0
      AIRPORT_PANEL_HOSTS: ${AIRPORT_PANEL_HOSTS:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  airport-data:
